name: screc
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: 1
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    # Pinned exactly: Package.resolved lives inside the gitignored xcodeproj,
    # so this is the only reproducibility anchor a clean clone has.
    exactVersion: 2.4.0
targets:
  screc:
    type: application
    platform: macOS
    sources:
      - path: screc
    configFiles:
      Debug: Config/signing.xcconfig
      Release: Config/signing.xcconfig
    dependencies:
      - package: KeyboardShortcuts
    scheme:
      testTargets:
        - screcTests
    postBuildScripts:
      - name: Stamp git version
        basedOnDependencyAnalysis: false
        script: |
          version=$(git -C "$SRCROOT" describe --tags --always --dirty 2>/dev/null || echo "$MARKETING_VERSION")
          version=${version#v}
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          if [ -f "$plist" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$plist"
          fi
    settings:
      base:
        # Anchored to the owned domain screc.app; fixed forever (TCC grants
        # and the future MAS container key off it).
        PRODUCT_BUNDLE_IDENTIFIER: app.screc
        PRODUCT_NAME: screc
        GENERATE_INFOPLIST_FILE: YES
        # Sober lowercase identity everywhere (diacritic branding retired 2026-07-26).
        INFOPLIST_KEY_CFBundleDisplayName: screc
        # Menu-bar-only app: no Dock icon, no app menu.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/screc-dev.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  # Hermetic unit tests: no app host, no GUI session needed (CI-safe). The
  # pure-logic sources under test are compiled directly into the bundle.
  screcTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: screcTests
      - path: screc/Core/OutputSizing.swift
      - path: screc/Core/RecordingNames.swift
      - path: screc/Core/GIFTiming.swift
      - path: screc/UI/RectAdjust.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.screc.tests
