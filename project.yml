name: screc
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: 1
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
targets:
  screc:
    type: application
    platform: macOS
    sources:
      - path: screc
    dependencies:
      - package: KeyboardShortcuts
    scheme: {}
    postBuildScripts:
      - name: Stamp git version
        basedOnDependencyAnalysis: false
        script: |
          version=$(git -C "$SRCROOT" describe --tags --always --dirty 2>/dev/null || echo "$MARKETING_VERSION")
          version=${version#v}
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          if [ -f "$plist" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$plist"
          fi
    settings:
      base:
        # Anchored to the owned domain screc.app; fixed forever (TCC grants
        # and the future MAS container key off it).
        PRODUCT_BUNDLE_IDENTIFIER: app.screc
        PRODUCT_NAME: screc
        GENERATE_INFOPLIST_FILE: YES
        # Sober lowercase identity everywhere (diacritic branding retired 2026-07-26).
        INFOPLIST_KEY_CFBundleDisplayName: screc
        # Menu-bar-only app: no Dock icon, no app menu.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/screc-dev.entitlements
        CODE_SIGN_STYLE: Automatic
        # Signed with the team's Apple Development certificate. macOS ties the
        # screen-recording permission to the signing identity, so a stable
        # identity keeps the grant across rebuilds; ad-hoc builds would be
        # re-prompted every time. Contributors without this team fall back to
        # ad-hoc automatically (see Config/local.xcconfig in the README).
        DEVELOPMENT_TEAM: SJ53Z596GU
        # The version-stamp script needs to write into the bundle and call git.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
