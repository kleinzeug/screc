name: screc
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
# AppStore is a Release-type configuration with sandbox entitlements and
# Apple Distribution signing (Config/appstore.xcconfig).
configs:
  Debug: debug
  Release: release
  AppStore: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    # Pinned exactly: Package.resolved lives inside the gitignored xcodeproj,
    # so this is the only reproducibility anchor a clean clone has.
    exactVersion: 2.4.0
targets:
  screc:
    type: application
    platform: macOS
    sources:
      - path: screc
    configFiles:
      Debug: Config/signing.xcconfig
      Release: Config/signing.xcconfig
      AppStore: Config/appstore.xcconfig
    dependencies:
      - package: KeyboardShortcuts
    scheme:
      testTargets:
        - screcTests
    # NOTE: versions are NOT patched into Info.plist by a build phase. Xcode's
    # ProcessInfoPlistFile step can run AFTER script phases (it does for the
    # AppStore configuration and does not for Debug), so a post-build edit is
    # silently discarded roughly half the time — including on store uploads,
    # where a wrong CFBundleVersion means a rejected build. The version comes
    # from build settings instead, which that step consumes as its input:
    #   MARKETING_VERSION      → CFBundleShortVersionString
    #   CURRENT_PROJECT_VERSION → CFBundleVersion
    # tools/release.sh and the archive command in docs/RELEASING.md pass both
    # explicitly (git-derived version, UTC-timestamp build number).
    settings:
      base:
        # Anchored to the owned domain screc.app; fixed forever (TCC grants
        # and the future MAS container key off it).
        PRODUCT_BUNDLE_IDENTIFIER: app.screc
        PRODUCT_NAME: screc
        GENERATE_INFOPLIST_FILE: YES
        # Sober lowercase identity everywhere (diacritic branding retired 2026-07-26).
        INFOPLIST_KEY_CFBundleDisplayName: screc
        # Menu-bar-only app: no Dock icon, no app menu.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Philipp Holzschneider"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "screc records the microphone only while you are recording, and only when microphone capture is enabled in Settings."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        # Skips the export-compliance question on every upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # CODE_SIGN_ENTITLEMENTS deliberately NOT set here: it lives in the
        # xcconfigs (dev entitlements in signing.xcconfig, sandbox set in
        # appstore.xcconfig) — a project-level value would override both.
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  # Hermetic unit tests: no app host, no GUI session needed (CI-safe). The
  # pure-logic sources under test are compiled directly into the bundle.
  screcTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: screcTests
      - path: screc/Core/OutputSizing.swift
      - path: screc/Core/RecordingNames.swift
      - path: screc/Core/GIFTiming.swift
      - path: screc/UI/RectAdjust.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.screc.tests
